<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - Gestión de proyectos y tareas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1>📋 TaskFlow</h1>
    <p>Frontend TypeScript consumiendo una API REST de FastAPI</p>
  </header>

  <main class="layout">
    <!-- PROYECTOS -->
    <section class="card">
      <h2>Proyectos</h2>
      <form id="project-form" class="form">
        <label>
          Nombre
          <input type="text" name="name" maxlength="100" required placeholder="Ej: API TaskFlow">
        </label>
        <label>
          Descripción
          <input type="text" name="description" maxlength="2000" placeholder="Opcional">
        </label>
        <label>
          Propietario
          <select name="owner_id" id="owner-select" required></select>
        </label>
        <button type="submit" class="btn btn-primary">Crear proyecto</button>
      </form>
      <ul id="project-list" class="list"></ul>
    </section>

    <!-- TAREAS -->
    <section class="card">
      <h2>Tareas <span id="current-project" class="subtitle"></span></h2>
      <form id="task-form" class="form">
        <label>
          Título
          <input type="text" name="title" maxlength="200" required placeholder="Ej: Escribir documentación">
        </label>
        <label>
          Prioridad
          <select name="priority">
            <option value="low">Baja</option>
            <option value="medium" selected>Media</option>
            <option value="high">Alta</option>
          </select>
        </label>
        <button type="submit" class="btn btn-primary">Añadir tarea</button>
      </form>
      <ul id="task-list" class="list"></ul>
    </section>

    <!-- ACTIVIDAD (MongoDB) -->
    <section class="card card-wide">
      <h2>Actividad reciente <span class="subtitle">guardada en MongoDB</span></h2>
      <ul id="log-list" class="list list-logs"></ul>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="dist/main.js"></script>
</body>
</html>
